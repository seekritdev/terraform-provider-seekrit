# GoReleaser config for terraform-provider-seekrit — HashiCorp's required
# Terraform Registry release layout: per-platform zips, a GPG-signed
# _SHA256SUMS, and the registry manifest.
#
# This runs on the PUBLIC mirror (seekritdev/terraform-provider-seekrit), not in
# the monorepo, because the Registry can only ingest releases from a public
# repository. The mirror's .github/workflows/release.yml invokes it on a `v*`
# tag, which seekrit's sync-terraform-provider-repo.yml pushes after
# release-please picks the version.
version: 2

# Set explicitly rather than derived from the repo name, so the artifact names
# are right whether GoReleaser runs on the mirror or in a local `--snapshot`:
# the Registry requires terraform-provider-{TYPE}_… filenames.
project_name: terraform-provider-seekrit

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    # The Terraform Registry requires the binary inside each archive to be named
    # terraform-provider-{NAME}_v{VERSION}.
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # GPG_FINGERPRINT is exported by the ghaction-import-gpg step in CI. The
      # matching public key must be registered on the Terraform Registry.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # GoReleaser creates the mirror's release for the tag and attaches everything.
  # The CHANGELOG that release-please wrote lives in the repo (and in the
  # monorepo's own release); the notes here are GoReleaser's commit summary.
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  # The mirror's history is squashed sync commits ("sync: …@<sha>"), so a
  # commit-derived changelog would say nothing. The real one is CHANGELOG.md,
  # written by release-please in the monorepo and synced here.
  disable: true
